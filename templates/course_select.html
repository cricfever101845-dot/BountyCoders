<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Your Course | Bounty Coders</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a1628 0%, #1a3a5c 50%, #0d2844 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle animated background particles */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 30%, rgba(30, 90, 160, 0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 70%, rgba(10, 50, 110, 0.18) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 48px 24px 80px;
      gap: 56px;
    }

    /* ── Heading ── */
    .heading {
      text-align: center;
    }

    .heading h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow:
        0 0 12px rgba(255, 255, 255, 0.55),
        0 0 28px rgba(100, 180, 255, 0.4),
        0 0 55px rgba(60, 140, 255, 0.25);
    }

    .heading .subtitle {
      margin-top: 10px;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.08em;
    }

    /* ── Course grid ── */
    .course-grid {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: stretch;
      gap: 30px;
    }

    /* ── Individual course card ── */
    .course-card {
      width: 200px;
      height: 250px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
      transition: all 0.3s ease;
      text-decoration: none;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      position: relative;
    }

    .course-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(
        180deg,
        transparent 60%,
        rgba(0, 0, 0, 0.45) 100%
      );
      pointer-events: none;
    }

    .course-card:hover {
      transform: scale(1.05);
      border-color: gold;
      box-shadow:
        0 0 18px rgba(255, 215, 0, 0.55),
        0 0 40px rgba(255, 215, 0, 0.25),
        0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .course-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px 8px 0 0;
      display: block;
      flex-shrink: 0;
    }

    .course-name {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.06em;
      text-align: center;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    /* ── Logout button ── */
    .logout-btn {
      position: fixed;
      bottom: 24px;
      right: 28px;
      color: #ff4444;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      text-decoration: none;
      background: none;
      border: none;
      transition: color 0.2s ease, text-shadow 0.2s ease;
      z-index: 10;
      user-select: none;
    }

    .logout-btn:hover {
      color: #ff6b6b;
      text-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
    }

    /* ── Gear button & popup ── */
    #gear-btn {
      position: fixed;
      top: 16px;
      right: 20px;
      font-size: 28px;
      cursor: pointer;
      color: #fff;
      background: none;
      border: none;
      transition: transform 0.25s ease;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      z-index: 100;
      line-height: 1;
    }
    #gear-btn:hover {
      transform: rotate(60deg);
    }

    #gear-popup {
      position: fixed;
      top: 56px;
      right: 20px;
      z-index: 300;
      background: rgba(173, 216, 230, 0.93);
      border: 2px solid navy;
      border-radius: 10px;
      padding: 12px 18px;
      display: none;
      min-width: 140px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
    }

    #gear-popup button {
      display: block;
      width: 100%;
      padding: 8px 14px;
      background: navy;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }
    #gear-popup button:hover {
      background: #001f5e;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .course-card {
        width: 160px;
        height: 210px;
      }

      .course-card img {
        height: 145px;
      }

      .course-name {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">

    <!-- Heading -->
    <div class="heading">
      <h1>Select Your Course</h1>
      <p class="subtitle">Choose a topic and begin your coding bounty</p>
    </div>

    <!-- Course Cards -->
    <div class="course-grid">

      <!-- Python -->
      <a class="course-card" href="/game/101" role="button" aria-label="Python course">
        <img src="/static/media/python.jpeg" alt="Python" draggable="false" />
        <span class="course-name">Python</span>
      </a>

      <!-- Java -->
      <a class="course-card" href="/game/102" role="button" aria-label="Java course">
        <img src="/static/media/java.jpeg" alt="Java" draggable="false" />
        <span class="course-name">Java</span>
      </a>

      <!-- HTML/CSS -->
      <a class="course-card" href="/game/103" role="button" aria-label="HTML/CSS course">
        <img src="/static/media/html.jpeg" alt="HTML/CSS" draggable="false" />
        <span class="course-name">HTML / CSS</span>
      </a>

      <!-- C Language -->
      <a class="course-card" href="/game/104" role="button" aria-label="C Language course">
        <img src="/static/media/c.jpeg" alt="C Language" draggable="false" />
        <span class="course-name">C Language</span>
      </a>

    </div>
  </div>

  <!-- Logout -->
  <a class="logout-btn" href="/logout" aria-label="Log out">Log out &lt;-]</a>

  <!-- Gear Settings Button & Popup -->
  <button id="gear-btn" title="Settings" aria-label="Settings">⚙</button>
  <div id="gear-popup">
    <button onclick="window.location.href='/home'">🏠 Home Page</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const gearBtn = document.getElementById('gear-btn');
      const gearPopup = document.getElementById('gear-popup');

      gearBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        gearPopup.style.display = (gearPopup.style.display === 'none' || gearPopup.style.display === '')
          ? 'block' : 'none';
      });

      document.addEventListener('click', (e) => {
        if (!gearPopup.contains(e.target) && e.target !== gearBtn) {
          gearPopup.style.display = 'none';
        }
      });
    });
  </script>

</body>
</html>
