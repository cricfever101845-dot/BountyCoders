<!DOCTYPE html>
<html lang="en">
<head>
<title>Bounty Coders - Crew Log-In</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #060a12;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Trebuchet MS', sans-serif;
  }

 
  .login-wrapper {
    background-image: url(../static/media/login.png);
    position: relative;
    width: 100%;
    max-width: 103.375rem;   
    aspect-ratio: 1654 / 967;
    margin: 0 auto;
  }

  .login-wrapper img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
    user-select: none;
    pointer-events: none; 
  }

  
  .overlay {
    position: absolute;
    background: transparent;
    border: none;
    outline: none;
    color: black;       
    caret-color:black;    
    font-size: 1.5em;
    letter-spacing: 0.05em;
    padding: 0;
  }

  .overlay::placeholder {
    color: white;
  }

  input.overlay {
    cursor: text;
  }

  #username {
    left: 30.5%;
    top: 32.5%;
    width: 38.5%;
    height: 7.5%;
  }

  #password {
    left: 30.5%;
    top: 45%;
    width: 38.5%;
    height: 7.5%;
  }

  #loginBtn {
    left: 37.5%;
    top: 57.5%;
    width: 27%;
    height: 8%;
    cursor: pointer;
  }

  .overlay:focus-visible {
    outline: 0.15rem dashed rgba(232, 196, 119, 0.8);
    outline-offset: 0.1rem;
  }
</style>
</head>
<body>

  <div class="login-wrapper">
    
      <form id="loginForm" autocomplete="off">
      <input
        type="text"
        id="username"
        name="username"
        class="overlay"
        placeholder="username"
        autocomplete="off"
        required
      >
      <input
        type="password"
        id="password"
        name="password"
        class="overlay"
        placeholder="password"
        autocomplete="off"
        required
      >
      <button type="submit" id="loginBtn" class="overlay"></button>
    </form>
  </div>

  <script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const loginForm = document.getElementById('loginForm');

    usernameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        passwordInput.focus();
      }
    });

    // Enter on password -> submit the form
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        loginForm.requestSubmit();
      }
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      const password = passwordInput.value;
      console.log('Login attempt:', username, password);
    });
  </script>

</body>
</html>
