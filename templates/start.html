<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bounty Coders{% if username %} – Welcome, {{ username }}{% endif %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a192f;
        }

        /* ── Full-screen background video ── */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            pointer-events: none;
        }

        /* ── Subtle atmosphere overlay ── */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.15);
            z-index: 2;
            pointer-events: none;
        }

        /* ── Start Button: Blue border, yellow inside ── */
        #start-btn, #start-label {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            z-index: 10;

            background-color: #FFD700;
            color: #002288;
            border: 4px solid #0033aa;
            border-radius: 50px;
            padding: 16px 52px;
            font-size: 26px;
            font-weight: 900;
            font-family: 'Arial Black', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            outline: none;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.65), 0 4px 16px rgba(0, 34, 136, 0.35);
            transition: all 0.3s ease;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translateX(-50%) scale(1);
                box-shadow: 0 0 25px rgba(255, 215, 0, 0.65), 0 4px 16px rgba(0, 34, 136, 0.35);
            }
            50% {
                transform: translateX(-50%) scale(1.05);
                box-shadow: 0 0 42px rgba(255, 215, 0, 0.9), 0 6px 22px rgba(0, 34, 136, 0.45);
            }
        }

        #start-btn:hover, #start-label:hover {
            background-color: #FFE44D;
            border-color: #001f66;
            color: #001f66;
            box-shadow: 0 0 45px rgba(255, 215, 0, 0.95), 0 8px 25px rgba(0, 34, 136, 0.5);
            transform: translateX(-50%) scale(1.08);
        }

        #start-btn:active, #start-label:active {
            transform: translateX(-50%) scale(0.98);
        }
    </style>
</head>
<body onclick="window.location.href='{{ url_for('login') }}'">

    <!-- Full-screen background video -->
    <video id="bg-video"
           src="{{ url_for('static', filename='media/background.mp4') }}"
           autoplay
           loop
           muted
           playsinline
           preload="auto">
        <source src="{{ url_for('static', filename='media/background.mp4') }}" type="video/mp4">
    </video>

    <!-- Overlay -->
    <div class="video-overlay"></div>

    <!-- Start Button (Blue border, yellow inside) -->
    <button id="start-btn" class="start-btn" onclick="event.stopPropagation(); window.location.href='{{ url_for('login') }}'">Touch to start</button>

    <script>
        const video = document.getElementById('bg-video');
        video.muted = true;
        video.defaultMuted = true;

        function playVideo() {
            const promise = video.play();
            if (promise !== undefined) {
                promise.catch(err => {
                    console.log("Autoplay waiting for user gesture:", err);
                });
            }
        }

        // Attempt immediate playback
        playVideo();

        // Also ensure playback starts on first mousemove or touch if blocked
        window.addEventListener('touchstart', playVideo, { once: true, passive: true });
        window.addEventListener('mousemove', playVideo, { once: true, passive: true });
    </script>

</body>
</html>
